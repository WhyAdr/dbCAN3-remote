name: portable-workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: dbcan-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyflakes && python3 -m pyflakes scripts/*.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: bash -n scripts/run_dbcan_workflow.sh
      - run: python3 -B scripts/gen_docs.py --check
      - run: python3 -B tools/refresh_files_sha256.py --check
      - run: sha256sum -c FILES.sha256
